<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>♡♡mingoのクジアプリ♡♡ </title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style id="custom-user-css">
        /* Yohji Yamamoto-inspired Monochrome Minimal default styling */
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.08em;
            border-radius: 0 !important;
        }
        button, input, select, textarea, div {
            border-radius: 0 !important;
        }
    </style>
</head>
<body id="app-body" class="bg-black text-white min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header / Navigation -->
    <header class="w-full border-b border-neutral-800 bg-black/95 backdrop-blur sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 id="header-title" class="text-xs uppercase tracking-widest font-light text-neutral-300">Kujibiki System</h1>
            <div class="flex items-center space-x-3">
                <button onclick="openHistoryModal()" class="px-4 py-2 text-xs uppercase tracking-wider text-neutral-400 hover:text-white transition border border-neutral-800 hover:border-neutral-500 bg-neutral-900">当選履歴</button>
                <button id="admin-nav-btn" onclick="handleAdminNavClick()" class="px-4 py-2 text-xs uppercase tracking-wider text-neutral-300 hover:text-white transition border border-neutral-700 hover:border-neutral-400 bg-neutral-900">管理画面</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-lg mx-auto px-6 py-16 flex-grow flex flex-col justify-center items-center w-full">
        <div id="main-card" class="w-full bg-[#0a0a0a] border border-neutral-800 p-10 text-center transition-all shadow-2xl relative">
            <h2 id="display-title" class="text-2xl font-light tracking-wider mb-3 text-neutral-100">♡抽選の儀♡</h2>
            <p id="display-desc" class="text-xs tracking-wide text-neutral-400 mb-10 leading-relaxed">♡ボタンを押して♡</p>

            <!-- Remaining draws counter -->
            <div class="mb-10 inline-block bg-neutral-900 border border-neutral-800 px-5 py-2 text-xs tracking-widest text-neutral-400">
                本日の回数: <span id="remaining-draws" class="text-white font-mono text-sm font-semibold">3</span>
            </div>

            <!-- Single Rectangular Draw Button -->
            <div class="flex justify-center mb-8">
                <button id="draw-btn" onclick="executeDraw()" class="w-full max-w-[280px] py-6 px-8 font-light text-sm tracking-widest uppercase transition-all duration-300 flex flex-col items-center justify-center border border-neutral-600 bg-neutral-900 hover:bg-white hover:text-black hover:border-white text-neutral-100 shadow-2xl active:scale-[0.98]">
                    <span class="mb-1 text-base font-light tracking-[0.2em]">クジを引く</span>
                    <span class="text-[10px] tracking-widest opacity-60">DRAW LOTTERY</span>
                </button>
            </div>

            <!-- Message / Status Box -->
            <div id="status-msg" class="text-xs tracking-wider text-neutral-400 min-h-[24px]"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-[10px] tracking-widest text-neutral-500 border-t border-neutral-900">
        &copy; ♡Mingo System♡ ARCHIVE. 
    </footer>

    <!-- Result Modal (Item Name Only) -->
    <div id="result-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] border border-neutral-800 max-w-sm w-full p-8 text-center shadow-2xl transform transition-all scale-95 opacity-0" id="result-modal-content">
            <span class="text-[10px] uppercase tracking-widest text-neutral-500 block mb-2">- 邂逅の結果 -</span>
            <div id="result-item-name" class="text-xl font-light tracking-wide text-white my-6 py-4 border-y border-neutral-800 bg-neutral-900/50">アイテム名</div>
            <p id="result-speech" class="text-xs text-neutral-400 mb-8 tracking-wider font-light leading-relaxed"></p>
            <button onclick="closeResultModal()" class="w-full py-3 px-4 bg-white text-black text-xs tracking-widest uppercase hover:bg-neutral-200 transition font-medium border border-white">閉じる</button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] border border-neutral-800 max-w-md w-full p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4 border-b border-neutral-800 pb-3">
                <h3 class="text-xs uppercase tracking-widest text-neutral-300">当選履歴リスト</h3>
                <button onclick="closeHistoryModal()" class="text-neutral-500 hover:text-white text-lg">&times;</button>
            </div>
            <div id="history-list-container" class="overflow-y-auto flex-grow divide-y divide-neutral-900 pr-1">
                <!-- History items injected here -->
            </div>
            <div class="mt-4 pt-3 border-t border-neutral-800 flex justify-between items-center">
                <button onclick="clearHistory()" class="px-3 py-2 bg-neutral-900 hover:bg-neutral-800 text-neutral-400 hover:text-white text-[10px] tracking-wider transition border border-neutral-800">履歴をクリア</button>
                <button onclick="closeHistoryModal()" class="px-5 py-2.5 bg-neutral-900 hover:bg-neutral-800 text-neutral-300 text-xs tracking-wider transition border border-neutral-700">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Password Prompt Modal -->
    <div id="password-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] border border-neutral-800 max-w-xs w-full p-6 shadow-2xl text-center">
            <h3 class="text-xs uppercase tracking-widest text-neutral-300 mb-3">管理者認証</h3>
            <p class="text-[11px] text-neutral-500 mb-4">パスワードを入力してください。</p>
            <input type="password" id="admin-pass-input" placeholder="Password" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs mb-4 focus:outline-none focus:border-white" onkeydown="if(event.key==='Enter')verifyAdminPassword()">
            <div class="flex space-x-2">
                <button onclick="closePasswordModal()" class="flex-1 py-2.5 bg-neutral-900 text-neutral-400 text-xs hover:bg-neutral-800 transition border border-neutral-700">取消</button>
                <button onclick="verifyAdminPassword()" class="flex-1 py-2.5 bg-white text-black text-xs font-medium hover:bg-neutral-200 transition border border-white">確認</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] border border-neutral-800 max-w-2xl w-full p-6 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b border-neutral-800 pb-3">
                <div class="flex items-center space-x-3">
                    <h3 class="text-xs uppercase tracking-widest text-neutral-200 font-semibold">管理コンソール</h3>
                    <span class="text-[10px] bg-neutral-800 text-neutral-300 px-2.5 py-1 tracking-wider border border-neutral-700">管理者モード (2名体制)</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="saveAdminSettings()" class="px-4 py-2 bg-white text-black hover:bg-neutral-200 text-xs tracking-wider transition font-medium border border-white">設定を保存</button>
                    <button onclick="closeAdminModal()" class="text-neutral-500 hover:text-white text-lg">&times;</button>
                </div>
            </div>

            <div class="overflow-y-auto flex-grow space-y-6 pr-2">
                <!-- Management Session Control & State Persistence & Refresh -->
                <div class="bg-neutral-900/80 p-4 border border-neutral-700 flex flex-col sm:flex-row justify-between items-center gap-3">
                    <div>
                        <h4 class="text-xs uppercase tracking-widest text-white font-semibold">管理画面セッション維持</h4>
                        <p class="text-[10px] text-neutral-400 mt-0.5">更新ボタンを押すかセッションを維持して管理画面状態を保ちます。</p>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="refreshAdminSession()" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs tracking-wider transition border border-neutral-600">更新 (継続)</button>
                        <button onclick="logoutAdminSession()" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 text-xs tracking-wider transition border border-neutral-600">終了</button>
                    </div>
                </div>

                <!-- System Config -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-neutral-900/60 p-4 border border-neutral-800">
                    <div>
                        <label class="block text-[11px] tracking-wider text-neutral-400 mb-1">1日の試行制限回数 (初期値: 3)</label>
                        <input type="number" id="admin-max-draws" min="1" max="100" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs font-mono">
                    </div>
                    <div>
                        <label class="block text-[11px] tracking-wider text-neutral-400 mb-1">制限回数リセット</label>
                        <button onclick="adminResetDailyCount()" class="w-full py-2 px-4 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs tracking-wider transition border border-neutral-700">全ユーザーの試行回数を初期化</button>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[11px] tracking-wider text-neutral-400 mb-1">当選時セリフ（一律変更）</label>
                        <input type="text" id="admin-speech-setting" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs">
                    </div>
                </div>

                <!-- Design & Aesthetics Settings -->
                <div class="bg-neutral-900/60 p-4 border border-neutral-800 space-y-3">
                    <h4 class="text-xs uppercase tracking-widest text-neutral-300 font-semibold">デザイン・色彩設定</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] text-neutral-400 mb-1">タイトル文字</label>
                            <input type="text" id="admin-title-text" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] text-neutral-400 mb-1">説明文</label>
                            <input type="text" id="admin-desc-text" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] text-neutral-400 mb-1">背景色 (CSSカラー)</label>
                            <input type="text" id="admin-bg-color" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] text-neutral-400 mb-1">背景画像URL</label>
                            <input type="text" id="admin-bg-image" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs">
                        </div>
                        <div>
                            <label class="block text-[11px] text-neutral-400 mb-1">全体文字色</label>
                            <input type="text" id="admin-text-color" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs font-mono">
                        </div>
                        <div>
                            <label class="block text-[11px] text-neutral-400 mb-1">クジ引きボタン色</label>
                            <input type="text" id="admin-btn-color" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs font-mono">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] text-neutral-400 mb-1">カスタムCSS</label>
                        <textarea id="admin-custom-css" rows="2" class="w-full px-3 py-2 bg-neutral-900 border border-neutral-700 text-white text-xs font-mono"></textarea>
                    </div>
                </div>

                <!-- Item Management -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center flex-wrap gap-2">
                        <h4 class="text-xs uppercase tracking-widest text-neutral-300 font-semibold">アイテム一覧・管理 (個数 1〜100)</h4>
                        <div class="flex space-x-2">
                            <button onclick="addNewItemRow()" class="px-3 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs tracking-wider transition border border-neutral-700">+ 追加</button>
                            <button onclick="addBatchItemsCode()" class="px-3 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-200 text-xs tracking-wider transition border border-neutral-700">コードから一括追加</button>
                        </div>
                    </div>
                    <div id="admin-items-list" class="space-y-3">
                        <!-- Dynamic item rows injected here -->
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-neutral-800 flex justify-between items-center">
                <span class="text-[10px] text-neutral-500">※設定反映には「設定を保存」を押してください。</span>
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-neutral-900 hover:bg-neutral-800 text-neutral-300 text-xs transition border border-neutral-700">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // --- Default Data ---
        const DEFAULT_ITEMS = [
            { id: 1, name: "ハロウィンキャンディー(嚙みつきゾンビ)", count: 10, image: "", info: "candy" },
            { id: 2, name: "ハロウィンキャンディー(ゆらゆらオバケ)", count: 10, image: "", info: "" },
            { id: 3, name: "ハロウィンキャンディー(ぐるぐる猫)", count: 8, image: "", info: "" },
            { id: 4, name: "オバケ柄スケスケ紐パン", count: 7, image: "", info: "" },
            { id: 5, name: "スカル柄スケスケ紐パン", count: 7, image: "", info: "" },
            { id: 6, name: "フラミンゴ柄Tバック", count: 10, image: "", info: "" },
            { id: 7, name: "SP賞：脳みそプリン", count: 10, image: "", info: "" },
            { id: 8, name: "ハロウィンゴムセット(normal、big、mega)", count: 10, image: "", info: "" },
            { id: 9, name: "N賞：ヌルヌルローション", count: 7, image: "", info: "" },
            { id: 11, name: "ぐるぐるハロウィンキャンディー", count: 17, image: "", info: "" },
            { id: 12, name: "ピンクの妖精なれる着ぐるみ", count: 3, image: "", info: "" },
            { id: 13, name: "ハロウィングミ(媚薬)", count: 10, image: "", info: "" },
            { id: 14, name: "ドリンク一杯引換券", count: 17, image: "", info: "" },
            { id: 15, name: "黒レースの穴あきTバック", count: 5, image: "", info: "" },
            { id: 16, name: "マッスルギンギン精力剤", count: 10, image: "", info: "" },
            { id: 17, name: "筋肉マッチョになれる着ぐるみ", count: 10, image: "", info: "" },
            { id: 18, name: "某ママの型取り20cm超えディルド", count: 10, image: "", info: "" },
            { id: 19, name: "ミンゴママのアクスタ", count: 10, image: "", info: "" },
            { id: 20, name: "某オーナーの型取り20cm超えディルド", count: 5, image: "", info: "" },
            { id: 21, name: "オーナー夜神のアクスタ", count: 7, image: "", info: "" },
            { id: 22, name: "ミンゴママのアクスタ(飲んだくれ.ver)", count: 10, image: "", info: "" },
            { id: 23, name: "特賞：豪華ハロウィンデビルケーキ", count: 5, image: "", info: "" },
            { id: 24, name: "特賞：特撰たらば蟹鍋セット", count: 3, image: "", info: "" },
            { id: 25, name: "参加賞：すなっくフラミンゴの白タオル(店名、店電入り)", count: 18, image: "", info: "" },
            { id: 26, name: "ミンゴママ＆オーナー夜神オリシャンセット", count: 10, image: "", info: "" },
            { id: 27, name: "特賞：豪華ハロウィンお菓子セット", count: 5, image: "", info: "" },
            { id: 28, name: "特賞：特上焼き肉セット", count: 3, image: "", info: "" },
            { id: 29, name: "特賞：特撰黒毛和牛すき焼きセット", count: 3, image: "", info: "" },
            { id: 30, name: "バカでかハロウィンチキン", count: 10, image: "", info: "" },
            { id: 31, name: "オネエが焼いた焼きいも", count: 10, image: "", info: "" },
            { id: 32, name: "オネエが揚げたメンチカツ", count: 10, image: "", info: "" },
            { id: 33, name: "オネエが握ったおにぎり(釜めし、明太マヨ)", count: 10, image: "", info: "" },
            { id: 34, name: "コスプレ衣装：ドラキュラ伯爵", count: 5, image: "", info: "" },
            { id: 35, name: "コスプレ衣装：メイド服", count: 5, image: "", info: "" },
            { id: 36, name: "コスプレ衣装：神父", count: 5, image: "", info: "" },
            { id: 37, name: "コスプレ衣装：シスター", count: 5, image: "", info: "" },
            { id: 38, name: "コスプレ衣装：黒猫", count: 5, image: "", info: "" },
            { id: 39, name: "コスプレ衣装：ゾンビ(特殊メイクセット付属)", count: 5, image: "", info: "" },
            { id: 40, name: "コウモリ柄スケスケ紐パン", count: 7, image: "", info: "" },
            { id: 41, name: "ふんどし", count: 7, image: "", info: "" }
            
        ];

        const DEFAULT_SETTINGS = {
            title: "Halloween抽選の儀",
            description: "ボタンを押して、今日の試練を乗り越えてね♡",
            maxDraws: 3,
            winSpeech: "さぁ運命のアイテムを受け取って頂戴♡",
            bgColor: "#000000",
            bgImage: "",
            textColor: "#ffffff",
            btnColor: "#171717",
            customCss: ""
        };

        const STORAGE_KEY_ITEMS = "kujibiki_items_v4";
        const STORAGE_KEY_SETTINGS = "kujibiki_settings_v4";
        const STORAGE_KEY_HISTORY = "kujibiki_history_v4";
        const STORAGE_KEY_USER_DATA = "kujibiki_userdata_v4";
        const STORAGE_KEY_ADMIN_SESSION = "kujibiki_admin_session_v4";

        window.onload = function() {
            checkMidnightReset();
            initStorageData();
            applySettings();
            updateDrawCountDisplay();

            // Check admin session persistence on load
            if (localStorage.getItem(STORAGE_KEY_ADMIN_SESSION) === "true") {
                updateAdminNavButton(true);
            }
        };

        function initStorageData() {
            if (!localStorage.getItem(STORAGE_KEY_ITEMS)) {
                localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(DEFAULT_ITEMS));
            }
            if (!localStorage.getItem(STORAGE_KEY_SETTINGS)) {
                localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(DEFAULT_SETTINGS));
            }
            if (!localStorage.getItem(STORAGE_KEY_HISTORY)) {
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify([]));
            }
        }

        // --- Midnight Auto-Reset Logic ---
        function checkMidnightReset() {
            const todayStr = new Date().toDateString();
            let userData = JSON.parse(localStorage.getItem(STORAGE_KEY_USER_DATA) || "{}");
            let items = JSON.parse(localStorage.getItem(STORAGE_KEY_ITEMS) || "[]");

            if (userData.lastDate !== todayStr) {
                // Reset user daily draw count
                userData = { lastDate: todayStr, drawCount: 0 };
                localStorage.setItem(STORAGE_KEY_USER_DATA, JSON.stringify(userData));
                
                // Optional midnight reset hook for items if needed or keep current inventory counts
            }
        }

        function getRemainingDraws() {
            checkMidnightReset();
            const settings = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS) || JSON.stringify(DEFAULT_SETTINGS));
            const userData = JSON.parse(localStorage.getItem(STORAGE_KEY_USER_DATA) || "{}");
            const max = settings.maxDraws || 3;
            const current = userData.drawCount || 0;
            return Math.max(0, max - current);
        }

        function updateDrawCountDisplay() {
            const remaining = getRemainingDraws();
            const counterEl = document.getElementById("remaining-draws");
            if (counterEl) {
                counterEl.textContent = remaining;
            }
            const btn = document.getElementById("draw-btn");
            if (btn) {
                if (remaining <= 0) {
                    btn.disabled = true;
                    btn.classList.add("opacity-40", "cursor-not-allowed");
                    showStatusMessage("本日の試行回数は上限に達しました。明日またお越しください。", "text-neutral-500");
                } else {
                    btn.disabled = false;
                    btn.classList.remove("opacity-40", "cursor-not-allowed");
                    showStatusMessage("", "text-neutral-400");
                }
            }
        }

        function applySettings() {
            const settings = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS) || JSON.stringify(DEFAULT_SETTINGS));
            
            const headerTitle = document.getElementById("header-title");
            if (headerTitle) headerTitle.textContent = settings.title;
            const displayTitle = document.getElementById("display-title");
            if (displayTitle) displayTitle.textContent = settings.title;
            const displayDesc = document.getElementById("display-desc");
            if (displayDesc) displayDesc.textContent = settings.description;

            const body = document.getElementById("app-body");
            if (body) {
                body.style.backgroundColor = settings.bgColor || "#000000";
                if (settings.bgImage) {
                    body.style.backgroundImage = `url('${settings.bgImage}')`;
                    body.style.backgroundSize = "cover";
                    body.style.backgroundPosition = "center";
                } else {
                    body.style.backgroundImage = "none";
                }
                body.style.color = settings.textColor || "#ffffff";
            }

            const drawBtn = document.getElementById("draw-btn");
            if (drawBtn && settings.btnColor) {
                drawBtn.style.backgroundColor = settings.btnColor;
            }

            const customCssTag = document.getElementById("custom-user-css");
            if (customCssTag) {
                customCssTag.textContent = (settings.customCss || "") + "\n* { border-radius: 0 !important; }";
            }
        }

        // --- Lottery Execution ---
        function executeDraw() {
            checkMidnightReset();
            const settings = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS) || JSON.stringify(DEFAULT_SETTINGS));
            let userData = JSON.parse(localStorage.getItem(STORAGE_KEY_USER_DATA) || "{}");
            const max = settings.maxDraws || 3;

            if ((userData.drawCount || 0) >= max) {
                showStatusMessage("本日の上限回数に達しています。", "text-neutral-500");
                return;
            }

            let items = JSON.parse(localStorage.getItem(STORAGE_KEY_ITEMS) || "[]");
            let availablePool = [];
            items.forEach((item, index) => {
                let count = parseInt(item.count) || 0;
                for (let i = 0; i < count; i++) {
                    availablePool.push(index);
                }
            });

            if (availablePool.length === 0) {
                showStatusMessage("現在クジの在庫が枯渇しております。", "text-neutral-500");
                return;
            }

            const randomIndex = Math.floor(Math.random() * availablePool.length);
            const winningItemIndex = availablePool[randomIndex];
            const wonItem = items[winningItemIndex];

            // Decrement item count
            items[winningItemIndex].count = Math.max(0, parseInt(items[winningItemIndex].count) - 1);
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));

            // Increment user draw count
            userData.drawCount = (userData.drawCount || 0) + 1;
            localStorage.setItem(STORAGE_KEY_USER_DATA, JSON.stringify(userData));
            updateDrawCountDisplay();

            // Record history (simple listing)
            let history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || "[]");
            history.unshift({
                date: new Date().toLocaleString(),
                itemName: wonItem.name
            });
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));

            showResultModal(wonItem.name, settings.winSpeech);
        }

        function showStatusMessage(msg, colorClass) {
            const el = document.getElementById("status-msg");
            if (el) {
                el.className = `text-xs tracking-wider min-h-[24px] ${colorClass}`;
                el.textContent = msg;
            }
        }

        function showResultModal(itemName, speech) {
            document.getElementById("result-item-name").textContent = itemName;
            document.getElementById("result-speech").textContent = speech;
            const modal = document.getElementById("result-modal");
            const content = document.getElementById("result-modal-content");
            modal.classList.remove("hidden");
            setTimeout(() => {
                content.classList.remove("scale-95", "opacity-0");
                content.classList.add("scale-100", "opacity-100");
            }, 10);
        }

        function closeResultModal() {
            const modal = document.getElementById("result-modal");
            const content = document.getElementById("result-modal-content");
            content.classList.remove("scale-100", "opacity-100");
            content.classList.add("scale-95", "opacity-0");
            setTimeout(() => { modal.classList.add("hidden"); }, 200);
        }

        function openHistoryModal() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY) || "[]");
            const container = document.getElementById("history-list-container");
            container.innerHTML = "";

            if (history.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-neutral-500 text-xs tracking-widest">当選履歴はありません</div>`;
            } else {
                history.forEach(item => {
                    const row = document.createElement("div");
                    row.className = "py-3 flex justify-between items-center text-xs tracking-wide";
                    row.innerHTML = `
                        <span class="font-light text-neutral-200">${escapeHtml(item.itemName)}</span>
                        <span class="text-[10px] text-neutral-500 font-mono">${item.date}</span>
                    `;
                    container.appendChild(row);
                });
            }
            document.getElementById("history-modal").classList.remove("hidden");
        }

        function closeHistoryModal() {
            document.getElementById("history-modal").classList.add("hidden");
        }

        function clearHistory() {
            if (confirm("当選履歴をクリアしますか？")) {
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify([]));
                openHistoryModal();
            }
        }

        // --- Admin Authentication & Navigation (Foolproof) ---
        function handleAdminNavClick() {
            if (localStorage.getItem(STORAGE_KEY_ADMIN_SESSION) === "true") {
                openAdminModal();
            } else {
                document.getElementById("admin-pass-input").value = "";
                document.getElementById("password-modal").classList.remove("hidden");
                setTimeout(() => document.getElementById("admin-pass-input").focus(), 50);
            }
        }

        function closePasswordModal() {
            document.getElementById("password-modal").classList.add("hidden");
        }

        function verifyAdminPassword() {
            const inputVal = document.getElementById("admin-pass-input").value;
            // Robust plain-text verification for password "days" as requested
            if (inputVal.trim() === "days") {
                localStorage.setItem(STORAGE_KEY_ADMIN_SESSION, "true");
                closePasswordModal();
                updateAdminNavButton(true);
                openAdminModal();
            } else {
                showModalCustomMessage("パスワードが一致しません。");
            }
        }

        function logoutAdminSession() {
            localStorage.removeItem(STORAGE_KEY_ADMIN_SESSION);
            updateAdminNavButton(false);
            closeAdminModal();
            showModalCustomMessage("管理モードを終了しました。");
        }

        function refreshAdminSession() {
            localStorage.setItem(STORAGE_KEY_ADMIN_SESSION, "true");
            showModalCustomMessage("管理画面セッションを更新・継続しました。");
        }

        function updateAdminNavButton(isLoggedIn) {
            const btn = document.getElementById("admin-nav-btn");
            if (!btn) return;
            if (isLoggedIn) {
                btn.textContent = "管理画面 (認証済)";
                btn.className = "px-4 py-2 text-xs uppercase tracking-wider text-white transition border border-white bg-neutral-800";
            } else {
                btn.textContent = "管理画面";
                btn.className = "px-4 py-2 text-xs uppercase tracking-wider text-neutral-300 hover:text-white transition border border-neutral-700 bg-neutral-900";
            }
        }

        function openAdminModal() {
            loadAdminValuesToForm();
            document.getElementById("admin-modal").classList.remove("hidden");
        }

        function closeAdminModal() {
            document.getElementById("admin-modal").classList.add("hidden");
            applySettings();
            updateDrawCountDisplay();
        }

        function loadAdminValuesToForm() {
            const settings = JSON.parse(localStorage.getItem(STORAGE_KEY_SETTINGS) || JSON.stringify(DEFAULT_SETTINGS));
            document.getElementById("admin-max-draws").value = settings.maxDraws;
            document.getElementById("admin-speech-setting").value = settings.winSpeech;
            document.getElementById("admin-title-text").value = settings.title;
            document.getElementById("admin-desc-text").value = settings.description;
            document.getElementById("admin-bg-color").value = settings.bgColor;
            document.getElementById("admin-bg-image").value = settings.bgImage;
            document.getElementById("admin-text-color").value = settings.textColor;
            document.getElementById("admin-btn-color").value = settings.btnColor;
            document.getElementById("admin-custom-css").value = settings.customCss;

            renderAdminItemsList();
        }

        function renderAdminItemsList() {
            const items = JSON.parse(localStorage.getItem(STORAGE_KEY_ITEMS) || "[]");
            const container = document.getElementById("admin-items-list");
            container.innerHTML = "";

            items.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "bg-neutral-900 p-3 border border-neutral-800 flex flex-col space-y-2 text-xs";
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <input type="text" value="${escapeHtml(item.name)}" data-index="${index}" data-field="name" placeholder="アイテム名" class="admin-item-input flex-grow px-3 py-2 bg-neutral-950 border border-neutral-700 text-white">
                        <div class="flex items-center space-x-1">
                            <span class="text-neutral-500 text-[10px]">個数(1-100):</span>
                            <input type="number" min="1" max="100" value="${item.count}" data-index="${index}" data-field="count" class="admin-item-input w-20 px-3 py-2 bg-neutral-950 border border-neutral-700 text-white font-mono">
                        </div>
                        <button onclick="removeAdminItem(${index})" class="px-3 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-400 hover:text-white transition text-[10px] border border-neutral-700">削除</button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="text" value="${escapeHtml(item.image || '')}" data-index="${index}" data-field="image" placeholder="画像URL" class="admin-item-input flex-grow px-3 py-2 bg-neutral-950 border border-neutral-700 text-neutral-400 text-[11px]">
                        <input type="file" accept="image/*" onchange="handleImageUpload(event, ${index})" class="text-[10px] text-neutral-500">
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="text" value="${escapeHtml(item.info || '')}" data-index="${index}" data-field="info" placeholder="追加情報（詳細）" class="admin-item-input flex-grow px-3 py-2 bg-neutral-950 border border-neutral-700 text-neutral-400 text-[11px]">
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function removeAdminItem(index) {
            let items = JSON.parse(localStorage.getItem(STORAGE_KEY_ITEMS) || "[]");
            items.splice(index, 1);
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
            renderAdminItemsList();
        }

        function handleImageUpload(event, index) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                let items = JSON.parse(localStorage.getItem(STORAGE_KEY_ITEMS) || "[]");
                items[index].image = e.target.result;
                localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));
                renderAdminItemsList();
            };
            reader.readAsDataURL(file);
        }

        function saveAdminSettings() {
            const settings = {
                maxDraws: parseInt(document.getElementById("admin-max-draws").value) || 3,
                winSpeech: document.getElementById("admin-speech-setting").value,
                title: document.getElementById("admin-title-text").value,
                description: document.getElementById("admin-desc-text").value,
                bgColor: document.getElementById("admin-bg-color").value,
                bgImage: document.getElementById("admin-bg-image").value,
                textColor: document.getElementById("admin-text-color").value,
                btnColor: document.getElementById("admin-btn-color").value,
                customCss: document.getElementById("admin-custom-css").value
            };
            localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));

            let items = JSON.parse(localStorage.getItem(STORAGE_KEY_ITEMS) || "[]");
            const inputs = document.querySelectorAll(".admin-item-input");
            inputs.forEach(input => {
                const idx = parseInt(input.getAttribute("data-index"));
                const field = input.getAttribute("data-field");
                if (items[idx]) {
                    if (field === "count") {
                        items[idx][field] = Math.min(100, Math.max(1, parseInt(input.value) || 1));
                    } else {
                        items[idx][field] = input.value;
                    }
                }
            });
            localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(items));

            showModalCustomMessage("設定を保存しました。");
            applySettings();
            updateDrawCountDisplay();
        }

        function adminResetDailyCount() {
            if (confirm("全ユーザーの本日の試行回数をリセットしますか？")) {
                let userData = JSON.parse(localStorage.getItem(STORAGE_KEY_USER_DATA) || "{}");
                userData.drawCount = 0;
                localStorage.setItem(STORAGE_KEY_USER_DATA, JSON.stringify(userData));
                updateDrawCountDisplay();
                showModalCustomMessage("試行回数をリセットしました。");
            }
        }

        function showModalCustomMessage(msg) {
            const note = document.createElement("div");
            note.className = "fixed top-5 left-1/2 transform -translate-x-1/2 bg-white text-black px-6 py-3 text-xs tracking-wider z-50 shadow-2xl transition-all duration-300";
            note.textContent = msg;
            document.body.appendChild(note);
            setTimeout(() => {
                note.style.opacity = "0";
                setTimeout(() => note.remove(), 300);
            }, 2000);
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
