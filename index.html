<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <title id="app-title">Halloweenクジ</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --bg-image: none;
            --title-color: #333333;
            --btn-color: #4f46e5;
            --btn-text-color: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--title-color);
            margin: 0;
            font-size: 1.8rem;
        }

        .top-btns {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: var(--btn-color);
            color: var(--btn-text-color);
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-danger {
            background-color: #ef4444;
            color: #fff;
        }

        .description {
            margin-bottom: 30px;
            color: #666;
            line-height: 1.5;
        }

        .kuji-section {
            text-align: center;
            margin: 40px 0;
        }

        #draw-btn {
            font-size: 1.5rem;
            padding: 20px 40px;
            border-radius: 50px;
            background-color: var(--btn-color);
            color: var(--btn-text-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .status-info {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #555;
        }

        /* モーダル共通 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #888;
        }

        /* 履歴・管理画面用スタイル */
        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #result-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--btn-color);
            margin: 20px 0;
            min-height: 1.5em;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="display-title">Halloweenクジ</h1>
            <div class="top-btns">
                <button class="btn-secondary" onclick="openHistory()">当選履歴</button>
                <button class="btn-secondary" onclick="openAdminModal()">管理画面</button>
            </div>
        </header>

        <div class="description" id="display-desc">
            毎日運試し！ボタンを押して何が当たるかお楽しみください。
        </div>

        <div class="kuji-section">
            <button id="draw-btn" onclick="drawKuji()">クジを引く！</button>
            <div id="result-display"></div>
            <div class="status-info" id="status-info"></div>
        </div>
    </div>

    <!-- 当選結果モーダル -->
    <div id="result-modal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <button class="close-modal" onclick="closeResultModal()">&times;</button>
            <h2>結果発表</h2>
            <div id="modal-result-text" style="font-size: 1.5rem; margin: 20px 0; font-weight: bold;"></div>
            <button class="btn-primary" onclick="closeResultModal()">閉じる</button>
        </div>
    </div>

    <!-- 当選履歴モーダル -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeHistory()">&times;</button>
            <h2>当選履歴</h2>
            <ul id="history-list"></ul>
            <button class="btn-danger" style="margin-top: 15px;" onclick="clearHistory()">履歴をクリア</button>
        </div>
    </div>

    <!-- パスワード入力モーダル -->
    <div id="password-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePasswordModal()">&times;</button>
            <h2>管理人認証</h2>
            <p>パスワードを入力してください</p>
            <div class="form-group">
                <input type="password" id="admin-password-input" placeholder="パスワード">
            </div>
            <button class="btn-primary" onclick="verifyPassword()">ログイン</button>
        </div>
    </div>

    <!-- 管理画面モーダル -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAdminModal()">&times;</button>
            <h2>管理画面</h2>
            
            <hr style="margin: 15px 0;">
            <h3>基本設定</h3>
            <div class="form-group">
                <label>タイトル</label>
                <input type="text" id="setting-title">
            </div>
            <div class="form-group">
                <label>説明文</label>
                <textarea id="setting-desc"></textarea>
            </div>
            <div class="form-group">
                <label>当選時のセリフ（一律）</label>
                <input type="text" id="setting-message">
            </div>
            <div class="form-group">
                <label>1日のクジ引き回数上限</label>
                <input type="number" id="setting-limit" min="1" max="10">
            </div>
            <div class="form-group">
                <label>背景色</label>
                <input type="color" id="setting-bgcolor">
            </div>
            <div class="form-group">
                <label>背景画像URL</label>
                <input type="text" id="setting-bgimage" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>文字色（タイトル）</label>
                <input type="color" id="setting-titlecolor">
            </div>
            <div class="form-group">
                <label>クジ引きボタン色</label>
                <input type="color" id="setting-btncolor">
            </div>
            <div class="form-group">
                <label>カスタムCSS</label>
                <textarea id="setting-css" placeholder=".container { border: 2px solid gold; }"></textarea>
            </div>
            <button class="btn-primary" onclick="saveSettings()">設定を保存して更新</button>

            <hr style="margin: 25px 0;">
            <h3>回数リセット</h3>
            <button class="btn-secondary" onclick="resetUserCounts()">全ユーザーの本日回数をリセット</button>

            <hr style="margin: 25px 0;">
            <h3>アイテム管理</h3>
            <div class="form-group">
                <label>新規アイテム追加</label>
                <input type="text" id="new-item-name" placeholder="アイテム名">
                <label style="margin-top: 5px;">個数 (1〜100)</label>
                <input type="number" id="new-item-count" min="1" max="100" value="10">
                <button class="btn-primary" style="margin-top: 8px;" onclick="addItem()">追加する</button>
            </div>

            <h4>登録アイテム一覧</h4>
            <ul id="admin-item-list"></ul>
            
            <button class="btn-secondary" style="margin-top: 20px;" onclick="location.reload()">画面を更新して維持</button>
        </div>
    </div>

    <!-- カスタムCSS適用用タグ -->
    <style id="custom-css-block"></style>

    <script>
        // --- 初期データ・設定 ---
        const CONFIG_KEY = 'kuji_config';
        const ITEMS_KEY = 'kuji_items';
        const HISTORY_KEY = 'kuji_history';
        const USER_STATE_KEY = 'kuji_user_state';

        // 初期設定値
        let config = JSON.parse(localStorage.getItem(CONFIG_KEY)) || {
            title: "ラッキーくじ",
            description: "毎日運試し！ボタンを押して何が当たるかお楽しみください。",
            winMessage: "おめでとうございます！「{item}」が当たりました！",
            dailyLimit: 3,
            bgColor: "#f0f4f8",
            bgImage: "",
            titleColor: "#333333",
            btnColor: "#4f46e5",
            customCss: ""
        };

        // 初期アイテム（コードから複数追加対応）
        let items = JSON.parse(localStorage.getItem(ITEMS_KEY)) || [
            { id: 1, name: "特賞：豪華焼肉セット", count: 2 },
            { id: 2, name: "C賞：ハロウィン お菓子セット", count: 10 },
            { id: 3, name: "Y賞：ハロウィンバカデカいチキン", count: 10 },
            { id: 4, name: "ハロウィンキャンディー(嚙みつきゾンビ)", count: 5 },
            { id: 5, name: "ハロウィンキャンディー(ゆらゆらオバケ)", count: 6 },
            { id: 6, name: "ハロウィンキャンディー(ぐるぐる猫)", count: 3 },
            { id: 7, name: "オバケ柄スケスケ紐パン", count: 7 },
            { id: 8, name: "スカル柄スケスケ紐パン", count: 7 },
            { id: 9, name: "フラミンゴ柄Tバック", count: 12 },
            { id: 10, name: "SP賞：脳みそプリン", count: 10 },
            { id: 11, name: "ハロウィンゴムセット(normal、big、mega)", count: 12 },
            { id: 12, name: "N賞：ヌルヌルローション", count: 12 },
            { id: 13, name: "ハロウィンキャンディー", count: 13 },
            { id: 14, name: "ハロウィングミ(媚薬)", count: 7 },
            { id: 15, name: "ピンクの妖精なれる着ぐるみ", count: 5 },
            { id: 16, name: "ドリンク一杯引換券", count: 15 },
            { id: 17, name: "黒レースの穴あきTバック", count: 7 },
            { id: 18, name: "マッスルギンギン精力剤", count: 20 },
            { id: 19, name: "筋肉マッチョになれる着ぐるみ", count: 10 },
            { id: 20, name: "参加賞: ミンゴママ オリジナルステッカー", count: 20 },
            { id: 21, name: "某ママの型取り20cm超えのアレ", count: 7 },
            { id: 22, name: "ミンゴママの顔ダイカットガーラント", count: 10 },
            { id: 23, name: "ミンゴママのアクスタ", count: 4 },
            { id: 24, name: "某オーナーの型取り20cm超えのアレ", count: 3 },
            { id: 25, name: "オーナー夜神のアクスタ", count: 2 },
            { id: 26, name: "ミンゴママのアクスタ(飲んだくれ.ver)", count: 7 },
            { id: 27, name: "特賞：豪華ハロウィンデビルケーキ", count: 2 },
            { id: 28, name: "参加賞：すなっくフラミンゴの白タオル(店名、店電入り)", count: 17 },
            { id: 29, name: "ミンゴママ＆オーナー夜神オリシャンセット", count: 5 },
            { id: 30, name: "美味しい焼きいも", count: 7 },
            { id: 31, name: "特賞：オカマと呑む泥酔コース引換券", count: 3 },
            { id: 32, name: "コスプレ衣装：ドラキュラ伯爵", count: 3 },
            { id: 33, name: "コスプレ衣装：ゾンビ", count: 3 },
            { id: 34, name: "コスプレ衣装：オオカミ男", count: 3 },
            { id: 35, name: "オネエが揚げたメンチカツ", count: 5 },
            { id: 36, name: "フラミンゴ柄のボクサーパンツ", count: 5 },
            { id: 37, name: "特賞：特撰たらば蟹鍋セット", count: 2 }
        ];

        let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];

        // 深夜0時自動リセットおよびローカル日付管理
        function checkDailyReset() {
            const todayStr = new Date().toDateString();
            let userState = JSON.parse(localStorage.getItem(USER_STATE_KEY)) || { date: todayStr, count: 0, itemsDate: todayStr };
            
            // 日付が変わっていたら回数をリセット
            if (userState.date !== todayStr) {
                userState.date = todayStr;
                userState.count = 0;
            }

            // 深夜0時判定：アイテムの在庫を日付変更時に初期補充するなどの日跨ぎ処理
            if (userState.itemsDate !== todayStr) {
                userState.itemsDate = todayStr;
                // 必要に応じた深夜0時リフレッシュ処理
            }

            localStorage.setItem(USER_STATE_KEY, JSON.stringify(userState));
            return userState;
        }

        // --- 画面初期化・反映 ---
        function applyConfig() {
            document.getElementById('app-title').innerText = config.title;
            document.getElementById('display-title').innerText = config.title;
            document.getElementById('display-desc').innerText = config.description;

            document.documentElement.style.setProperty('--bg-color', config.bgColor);
            document.documentElement.style.setProperty('--bg-image', config.bgImage ? `url('${config.bgImage}')` : 'none');
            document.documentElement.style.setProperty('--title-color', config.titleColor);
            document.documentElement.style.setProperty('--btn-color', config.btnColor);
            document.getElementById('custom-css-block').innerText = config.customCss;

            updateStatusInfo();
        }

        function updateStatusInfo() {
            const userState = checkDailyReset();
            const remain = Math.max(0, config.dailyLimit - userState.count);
            document.getElementById('status-info').innerText = `本日の残りクジ回数: ${remain} / ${config.dailyLimit} 回`;
        }

        // --- クジを引く処理 ---
        function drawKuji() {
            let userState = checkDailyReset();

            if (userState.count >= config.dailyLimit) {
                alert("本日のクジ引き回数上限に達しました。");
                return;
            }

            // 在庫があるアイテムプールを作成
            let pool = [];
            items.forEach(item => {
                for (let i = 0; i < item.count; i++) {
                    pool.push(item);
                }
            });

            if (pool.length === 0) {
                alert("現在引けるクジ（アイテム）がありません。");
                return;
            }

            // 抽選
            const randomIndex = Math.floor(Math.random() * pool.length);
            const wonItem = pool[randomIndex];

            // アイテムの在庫を減らす
            const targetItem = items.find(i => i.id === wonItem.id);
            if (targetItem && targetItem.count > 0) {
                targetItem.count--;
            }
            saveItems();

            // 回数消費
            userState.count++;
            localStorage.setItem(USER_STATE_KEY, JSON.stringify(userState));
            updateStatusInfo();

            // 履歴に追加
            const now = new Date().toLocaleString();
            history.unshift({ time: now, name: wonItem.name });
            if (history.length > 50) history.pop(); // 最大50件
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));

            // メッセージ表示
            const msg = config.winMessage.replace('{item}', wonItem.name);
            document.getElementById('modal-result-text').innerText = msg;
            document.getElementById('result-modal').style.display = 'flex';
        }

        function closeResultModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // --- 履歴関連 ---
        function openHistory() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            if (history.length === 0) {
                listEl.innerHTML = '<li>履歴はありません</li>';
            } else {
                history.forEach((h, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${h.time} - <strong>${h.name}</strong></span>`;
                    // 履歴からも追加ができる機能
                    const addBtn = document.createElement('button');
                    addBtn.className = 'btn-secondary';
                    addBtn.innerText = 'アイテム再登録';
                    addBtn.style.padding = '4px 8px';
                    addBtn.style.fontSize = '0.8rem';
                    addBtn.onclick = () => addFromHistory(h.name);
                    li.appendChild(addBtn);
                    listEl.appendChild(li);
                });
            }
            document.getElementById('history-modal').style.display = 'flex';
        }

        function closeHistory() {
            document.getElementById('history-modal').style.display = 'none';
        }

        function clearHistory() {
            if (confirm("履歴をすべてクリアしますか？")) {
                history = [];
                localStorage.removeItem(HISTORY_KEY);
                openHistory();
            }
        }

        function addFromHistory(itemName) {
            items.push({
                id: Date.now(),
                name: itemName,
                count: 10
            });
            saveItems();
            alert(`「${itemName}」をアイテムに追加しました（個数: 10）。`);
            openAdminModal();
        }

        // --- 管理画面・認証関連 ---
        function openAdminModal() {
            document.getElementById('password-modal').style.display = 'flex';
        }

        function closePasswordModal() {
            document.getElementById('password-modal').style.display = 'none';
            document.getElementById('admin-password-input').value = '';
        }

        function verifyPassword() {
            const inputVal = document.getElementById('admin-password-input').value;
            // パスワードは days
            if (inputVal === 'days') {
                closePasswordModal();
                loadAdminFormValues();
                document.getElementById('admin-modal').style.display = 'flex';
            } else {
                alert('パスワードが違います');
            }
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function loadAdminFormValues() {
            document.getElementById('setting-title').value = config.title;
            document.getElementById('setting-desc').value = config.description;
            document.getElementById('setting-message').value = config.winMessage;
            document.getElementById('setting-limit').value = config.dailyLimit;
            document.getElementById('setting-bgcolor').value = config.bgColor;
            document.getElementById('setting-bgimage').value = config.bgImage;
            document.getElementById('setting-titlecolor').value = config.titleColor;
            document.getElementById('setting-btncolor').value = config.btnColor;
            document.getElementById('setting-css').value = config.customCss;
            renderAdminItemList();
        }

        function saveSettings() {
            config.title = document.getElementById('setting-title').value;
            config.description = document.getElementById('setting-desc').value;
            config.winMessage = document.getElementById('setting-message').value;
            config.dailyLimit = parseInt(document.getElementById('setting-limit').value) || 3;
            config.bgColor = document.getElementById('setting-bgcolor').value;
            config.bgImage = document.getElementById('setting-bgimage').value;
            config.titleColor = document.getElementById('setting-titlecolor').value;
            config.btnColor = document.getElementById('setting-btncolor').value;
            config.customCss = document.getElementById('setting-css').value;

            localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
            applyConfig();
            alert('設定を保存しました！');
        }

        function resetUserCounts() {
            if (confirm("全ユーザーの本日利用回数をリセットしますか？")) {
                let userState = JSON.parse(localStorage.getItem(USER_STATE_KEY)) || {};
                userState.count = 0;
                localStorage.setItem(USER_STATE_KEY, JSON.stringify(userState));
                updateStatusInfo();
                alert("回数をリセットしました。");
            }
        }

        // --- アイテム操作関連 ---
        function saveItems() {
            localStorage.setItem(ITEMS_KEY, JSON.stringify(items));
        }

        function renderAdminItemList() {
            const listEl = document.getElementById('admin-item-list');
            listEl.innerHTML = '';
            items.forEach((item, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div style="display: flex; gap: 5px; align-items: center; width: 70%;">
                        <input type="text" value="${item.name}" id="edit-name-${index}" style="padding: 4px; flex: 1;">
                        <input type="number" value="${item.count}" min="1" max="100" id="edit-count-${index}" style="width: 60px; padding: 4px;">
                    </div>
                    <div style="display: flex; gap: 5px;">
                        <button class="btn-primary" style="padding: 5px 8px; font-size: 0.8rem;" onclick="updateItem(${index})">保存</button>
                        <button class="btn-danger" style="padding: 5px 8px; font-size: 0.8rem;" onclick="deleteItem(${index})">削除</button>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        function addItem() {
            const nameInput = document.getElementById('new-item-name');
            const countInput = document.getElementById('new-item-count');
            const name = nameInput.value.trim();
            const count = parseInt(countInput.value);

            if (!name) {
                alert("アイテム名を入力してください。");
                return;
            }
            if (isNaN(count) || count < 1 || count > 100) {
                alert("個数は1から100の間で指定してください。");
                return;
            }

            items.push({ id: Date.now(), name: name, count: count });
            saveItems();
            nameInput.value = '';
            countInput.value = '10';
            renderAdminItemList();
        }

        function updateItem(index) {
            const name = document.getElementById(`edit-name-${index}`).value.trim();
            const count = parseInt(document.getElementById(`edit-count-${index}`).value);

            if (!name) {
                alert("アイテム名を入力してください。");
                return;
            }
            if (isNaN(count) || count < 1 || count > 100) {
                alert("個数は1から100の間で指定してください。");
                return;
            }

            items[index].name = name;
            items[index].count = count;
            saveItems();
            alert("アイテムを更新しました。");
            renderAdminItemList();
        }

        function deleteItem(index) {
            if (confirm(`「${items[index].name}」を削除しますか？`)) {
                items.splice(index, 1);
                saveItems();
                renderAdminItemList();
            }
        }

        // 初期設定ロード実行
        applyConfig();
    </script>
</body>
</html>
