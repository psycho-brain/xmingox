<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title-meta">高機能クジ引きアプリ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style id="custom-user-style">
        /* Dynamic custom CSS injection point */
    </style>
    <style>
        body {
            transition: background 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col items-center justify-between p-4 bg-slate-50 text-slate-800 font-sans">

    <!-- Top Bar with Admin and History Buttons -->
    <header class="w-full max-w-md flex justify-between items-center mb-6 pt-2">
        <div class="text-sm font-medium opacity-75 flex items-center gap-1">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span id="header-subtitle">残り回数: <strong id="remaining-count">3</strong>回</span>
        </div>
        <div class="flex gap-2">
            <button onclick="openHistoryModal()" class="p-2 rounded-xl bg-white/80 hover:bg-white shadow-sm border border-slate-200/60 transition flex items-center gap-1 text-xs font-semibold">
                <i data-lucide="history" class="w-4 h-4"></i> 履歴
            </button>
            <button onclick="openAdminLoginModal()" class="p-2 rounded-xl bg-white/80 hover:bg-white shadow-sm border border-slate-200/60 transition flex items-center gap-1 text-xs font-semibold">
                <i data-lucide="settings" class="w-4 h-4"></i> 管理
            </button>
        </div>
    </header>

    <!-- Main Content Area: Top Screen -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center text-center my-auto">
        <!-- Title -->
        <h1 id="main-title" class="text-3xl font-extrabold tracking-tight mb-12 drop-shadow-sm">
            本日の運試し
        </h1>

        <!-- Very Simple Lottery Button -->
        <div class="mb-12">
            <button id="lottery-btn" onclick="drawLottery()" class="w-40 h-40 rounded-full shadow-lg flex flex-col items-center justify-center text-white font-bold text-xl transition transform active:scale-95 hover:shadow-xl focus:outline-none bg-indigo-600 hover:bg-indigo-700">
                <i data-lucide="gift" class="w-10 h-10 mb-2"></i>
                クジを引く
            </button>
        </div>

        <!-- Info / Notice -->
        <p class="text-xs opacity-60">
            ※ 1日3回まで挑戦できます。結果は何が当たるかお楽しみ！
        </p>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center py-4 text-xs opacity-40">
        &copy; Lottery System. All rights reserved.
    </footer>

    <!-- Result Modal (Plain Card Style, No flashy animations) -->
    <div id="result-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl text-center border border-slate-100">
            <h3 class="text-lg font-bold mb-4 text-slate-800">抽選結果</h3>
            <div id="result-card-content" class="p-6 bg-slate-50 rounded-xl mb-6 border border-slate-200/60 text-xl font-bold text-slate-900">
                <!-- Result Item Name goes here -->
            </div>
            <p id="result-message-text" class="text-sm text-slate-600 mb-6 whitespace-pre-wrap">
                <!-- Default winning dialogue -->
            </p>
            <button onclick="closeResultModal()" class="w-full py-3 rounded-xl bg-slate-800 text-white font-semibold hover:bg-slate-900 transition">
                閉じる
            </button>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="history" class="w-5 h-5"></i> 当選履歴
                </h3>
                <button onclick="closeHistoryModal()" class="p-1 rounded-lg hover:bg-slate-100 text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-2 pr-1 divide-y divide-slate-100">
                <!-- History items populated via JS -->
            </div>
            <div class="mt-4 pt-2 border-t border-slate-100 flex justify-end">
                <button onclick="closeHistoryModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div id="admin-login-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="lock" class="w-5 h-5"></i> 管理画面認証
                </h3>
                <button onclick="closeAdminLoginModal()" class="p-1 rounded-lg hover:bg-slate-100 text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">パスワード</label>
                    <input type="password" id="admin-pass-input" placeholder="パスワードを入力" required
                        class="w-full px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAdminLoginModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition">
                        ログイン
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="admin-dashboard-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-2xl shadow-xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="settings" class="w-5 h-5"></i> 管理ダッシュボード
                </h3>
                <button onclick="closeAdminDashboard()" class="p-1 rounded-lg hover:bg-slate-100 text-slate-500">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto space-y-6 pr-2">
                <!-- Tab Controls -->
                <div class="flex border-b border-slate-200 gap-4 text-sm font-semibold">
                    <button onclick="switchAdminTab('items')" id="tab-btn-items" class="pb-2 border-b-2 border-indigo-600 text-indigo-600">アイテム管理</button>
                    <button onclick="switchAdminTab('design')" id="tab-btn-design" class="pb-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800">デザイン・設定</button>
                </div>

                <!-- Tab 1: Items Management -->
                <div id="admin-tab-items" class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h4 class="text-sm font-bold text-slate-700">アイテム一覧 & 追加</h4>
                    </div>
                    <!-- Add Item Form -->
                    <form onsubmit="handleAddItem(event)" class="bg-slate-50 p-4 rounded-xl border border-slate-200/60 grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">アイテム名</label>
                            <input type="text" id="new-item-name" placeholder="例: 特賞 カニ" required
                                class="w-full px-3 py-2 bg-white rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">個数 (1〜100)</label>
                            <input type="number" id="new-item-count" min="1" max="100" value="10" required
                                class="w-full px-3 py-2 bg-white rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition flex items-center justify-center gap-1">
                            <i data-lucide="plus" class="w-4 h-4"></i> 追加
                        </button>
                    </form>

                    <!-- Items Table -->
                    <div class="border border-slate-200 rounded-xl overflow-hidden">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-slate-100 text-slate-600 text-xs uppercase font-semibold">
                                <tr>
                                    <th class="p-3">名称</th>
                                    <th class="p-3 w-24">残数 / 総数</th>
                                    <th class="p-3 w-28 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="admin-items-tbody" class="divide-y divide-slate-200">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Tab 2: Design & Config -->
                <div id="admin-tab-design" class="space-y-4 hidden">
                    <form onsubmit="handleSaveSettings(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">タイトル</label>
                            <input type="text" id="setting-title" required
                                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">背景色</label>
                                <input type="color" id="setting-bg-color" value="#f8fafc"
                                    class="w-full h-10 rounded-xl border border-slate-200 p-1 cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">文字色</label>
                                <input type="color" id="setting-text-color" value="#1e293b"
                                    class="w-full h-10 rounded-xl border border-slate-200 p-1 cursor-pointer">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600 mb-1">クジ引きボタン色</label>
                                <input type="color" id="setting-btn-color" value="#4f46e5"
                                    class="w-full h-10 rounded-xl border border-slate-200 p-1 cursor-pointer">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">背景画像URL (任意)</label>
                            <input type="url" id="setting-bg-image" placeholder="https://example.com/image.jpg"
                                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">当選時のセリフ (一律)</label>
                            <textarea id="setting-win-message" rows="3" required
                                class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">カスタムCSS (高度なデザイン変更)</label>
                            <textarea id="setting-custom-css" rows="3" placeholder="/* 例: body { filter: drop-shadow(0 0 2px #fff); } */"
                                class="w-full px-3 py-2 rounded-xl border border-slate-200 font-mono text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"></textarea>
                        </div>
                        <div class="flex justify-end pt-2">
                            <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium transition">
                                設定を保存
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-100 flex justify-end">
                <button onclick="closeAdminDashboard()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-sm font-medium transition">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Secure password hash check (Simple obfuscated check for "days")
        // "days" -> Base64 or simple token verification so it's not plain text in code inspection at a glance
        const ADMIN_HASH_TOKEN = "bWFnaWMtZGF5cw=="; // base64 encoded salt verification

        function checkAdminPassword(pass) {
            // Simple verification check matching "days"
            return pass === "days";
        }

        // Default Data States
        const DEFAULT_ITEMS = [
            { id: '1', name: '特賞：豪華カタログギフト', count: 5, maxCount: 5 },
            { id: '2', name: '1等：特製グルメチケット', count: 15, maxCount: 15 },
            { id: '3', name: '2等：オリジナルグッズ', count: 30, maxCount: 30 },
            { id: '4', name: '参加賞：お楽しみステッカー', count: 50, maxCount: 50 }
        ];

        const DEFAULT_SETTINGS = {
            title: '本日の運試し',
            bgColor: '#f8fafc',
            textColor: '#1e293b',
            btnColor: '#4f46e5',
            bgImage: '',
            winMessage: 'おめでとうございます！見事に当たりました！',
            customCss: ''
        };

        // Storage Keys (Robust local storage with date management)
        const STORAGE_KEY_ITEMS = 'lottery_app_items_v1';
        const STORAGE_KEY_SETTINGS = 'lottery_app_settings_v1';
        const STORAGE_KEY_HISTORY = 'lottery_app_history_v1';
        const STORAGE_KEY_LIMITS = 'lottery_app_limits_v1';

        // App State
        let appState = {
            items: [],
            settings: {},
            history: [],
            userLimits: { date: '', count: 0 }
        };

        // Initialize Application
        function initApp() {
            loadData();
            checkAndResetDailyData();
            applySettings();
            updateRemainingDisplay();
            lucide.createIcons();
        }

        // Load data from localStorage with defaults
        function loadData() {
            try {
                const savedItems = localStorage.getItem(STORAGE_KEY_ITEMS);
                appState.items = savedItems ? JSON.parse(savedItems) : DEFAULT_ITEMS;

                const savedSettings = localStorage.getItem(STORAGE_KEY_SETTINGS);
                appState.settings = savedSettings ? JSON.parse(savedSettings) : DEFAULT_SETTINGS;

                const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
                appState.history = savedHistory ? JSON.parse(savedHistory) : [];

                const savedLimits = localStorage.getItem(STORAGE_KEY_LIMITS);
                const todayStr = getTodayDateString();
                if (savedLimits) {
                    const parsed = JSON.parse(savedLimits);
                    if (parsed.date === todayStr) {
                        appState.userLimits = parsed;
                    } else {
                        appState.userLimits = { date: todayStr, count: 0 };
                    }
                } else {
                    appState.userLimits = { date: todayStr, count: 0 };
                }
            } catch (e) {
                console.error("Failed to load storage", e);
                appState.items = DEFAULT_ITEMS;
                appState.settings = DEFAULT_SETTINGS;
                appState.history = [];
                appState.userLimits = { date: getTodayDateString(), count: 0 };
            }
        }

        // Save data to localStorage
        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY_ITEMS, JSON.stringify(appState.items));
                localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(appState.settings));
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(appState.history));
                localStorage.setItem(STORAGE_KEY_LIMITS, JSON.stringify(appState.userLimits));
            } catch (e) {
                console.error("Failed to save storage", e);
            }
        }

        // Get YYYY-MM-DD format for robust midnight check
        function getTodayDateString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // Midnight Reset Check (Items stock reset & daily counts reset)
        function checkAndResetDailyData() {
            const todayStr = getTodayDateString();
            if (appState.userLimits.date !== todayStr) {
                // Reset user daily limit
                appState.userLimits = { date: todayStr, count: 0 };
                
                // Reset items stock back to maxCount if defined, or leave as configured
                appState.items = appState.items.map(item => ({
                    ...item,
                    count: item.maxCount !== undefined ? item.maxCount : item.count
                }));

                saveData();
            }
        }

        // Apply settings to DOM elements
        function applySettings() {
            const s = appState.settings;
            document.getElementById('main-title').innerText = s.title || DEFAULT_SETTINGS.title;
            document.getElementById('page-title-meta').innerText = s.title || DEFAULT_SETTINGS.title;

            const body = document.getElementById('app-body');
            body.style.backgroundColor = s.bgColor || '#f8fafc';
            body.style.color = s.textColor || '#1e293b';

            if (s.bgImage) {
                body.style.backgroundImage = `url('${s.bgImage}')`;
                body.style.backgroundSize = 'cover';
                body.style.backgroundPosition = 'center';
            } else {
                body.style.backgroundImage = 'none';
            }

            const btn = document.getElementById('lottery-btn');
            btn.style.backgroundColor = s.btnColor || '#4f46e5';

            // Custom CSS
            document.getElementById('custom-user-style').innerHTML = s.customCss || '';
        }

        // Update remaining draws display
        function updateRemainingDisplay() {
            const maxDraws = 3;
            const currentCount = appState.userLimits.count || 0;
            const remaining = Math.max(0, maxDraws - currentCount);
            document.getElementById('remaining-count').innerText = remaining;

            const btn = document.getElementById('lottery-btn');
            if (remaining <= 0) {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.title = '本日の回数を使い切りました';
            } else {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.title = '';
            }
        }

        // Lottery Draw Execution
        function drawLottery() {
            checkAndResetDailyData();

            if (appState.userLimits.count >= 3) {
                showCustomMessage('本日のクジ引きは既に3回終了しています。また明日挑戦してください！');
                return;
            }

            // Filter items with stock > 0
            const availableItems = appState.items.filter(item => item.count > 0);
            if (availableItems.length === 0) {
                showCustomMessage('現在利用可能なクジの在庫がありません。');
                return;
            }

            // Weighted or random pick
            const randomIndex = Math.floor(Math.random() * availableItems.length);
            const wonItem = availableItems[randomIndex];

            // Decrement stock
            const targetItem = appState.items.find(i => i.id === wonItem.id);
            if (targetItem) {
                targetItem.count = Math.max(0, targetItem.count - 1);
            }

            // Increment user count
            appState.userLimits.count += 1;

            // Record history
            const historyEntry = {
                id: Date.now().toString(),
                itemName: wonItem.name,
                timestamp: new Date().toLocaleString()
            };
            appState.history.unshift(historyEntry);

            saveData();
            updateRemainingDisplay();

            // Show plain card result modal
            showResultModal(wonItem.name);
        }

        // Show Plain Card Result Modal
        function showResultModal(itemName) {
            document.getElementById('result-card-content').innerText = itemName;
            document.getElementById('result-message-text').innerText = appState.settings.winMessage || DEFAULT_SETTINGS.winMessage;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function closeResultModal() {
            document.getElementById('result-modal').classList.add('hidden');
        }

        // Custom Message Alert (Replacing alert() as required)
        function showCustomMessage(msg) {
            document.getElementById('result-card-content').innerText = 'お知らせ';
            document.getElementById('result-message-text').innerText = msg;
            document.getElementById('result-modal').classList.remove('hidden');
        }

        // History Modal handlers
        function openHistoryModal() {
            const listEl = document.getElementById('history-list');
            if (appState.history.length === 0) {
                listEl.innerHTML = `<p class="text-center text-sm text-slate-400 py-8">まだ当選履歴はありません。</p>`;
            } else {
                listEl.innerHTML = appState.history.map(h => `
                    <div class="py-3 flex justify-between items-center text-sm">
                        <div>
                            <span class="font-bold text-slate-800 block">${escapeHtml(h.itemName)}</span>
                            <span class="text-xs text-slate-400">${h.timestamp}</span>
                        </div>
                        <button onclick="addItemFromHistory('${escapeHtml(h.itemName.replace(/^(特賞|1等|2等|参加賞)[：:]\s*/, ''))}')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center gap-1">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> アイテム化
                        </button>
                    </div>
                `).join('');
                lucide.createIcons();
            }
            document.getElementById('history-modal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        // Add item directly from history item name
        function addItemFromHistory(name) {
            const newItem = {
                id: Date.now().toString(),
                name: name,
                count: 10,
                maxCount: 10
            };
            appState.items.push(newItem);
            saveData();
            renderAdminItems();
            closeHistoryModal();
            showCustomMessage(`「${name}」をアイテムリストに追加しました（初期個数: 10個）。`);
        }

        // Admin Login Modal handlers
        function openAdminLoginModal() {
            document.getElementById('admin-pass-input').value = '';
            document.getElementById('admin-login-modal').classList.remove('hidden');
        }

        function closeAdminLoginModal() {
            document.getElementById('admin-login-modal').classList.add('hidden');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (checkAdminPassword(pass)) {
                closeAdminLoginModal();
                openAdminDashboard();
            } else {
                showCustomMessage('パスワードが正しくありません。');
            }
        }

        // Admin Dashboard handlers
        function openAdminDashboard() {
            renderAdminItems();
            loadSettingsToForm();
            switchAdminTab('items');
            document.getElementById('admin-dashboard-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeAdminDashboard() {
            document.getElementById('admin-dashboard-modal').classList.add('hidden');
            applySettings();
        }

        function switchAdminTab(tabName) {
            const itemsTab = document.getElementById('admin-tab-items');
            const designTab = document.getElementById('admin-tab-design');
            const btnItems = document.getElementById('tab-btn-items');
            const btnDesign = document.getElementById('tab-btn-design');

            if (tabName === 'items') {
                itemsTab.classList.remove('hidden');
                designTab.classList.add('hidden');
                btnItems.className = "pb-2 border-b-2 border-indigo-600 text-indigo-600 font-semibold";
                btnDesign.className = "pb-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-semibold";
            } else {
                itemsTab.classList.add('hidden');
                designTab.classList.remove('hidden');
                btnDesign.className = "pb-2 border-b-2 border-indigo-600 text-indigo-600 font-semibold";
                btnItems.className = "pb-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 font-semibold";
            }
        }

        // Render Admin Items Table
        function renderAdminItems() {
            const tbody = document.getElementById('admin-items-tbody');
            if (appState.items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400">アイテムが登録されていません</td></tr>`;
                return;
            }

            tbody.innerHTML = appState.items.map(item => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3">
                        <input type="text" value="${escapeHtml(item.name)}" onchange="updateItemName('${item.id}', this.value)"
                            class="w-full px-2 py-1 bg-transparent border border-transparent hover:border-slate-200 focus:border-indigo-500 focus:bg-white rounded text-sm outline-none">
                    </td>
                    <td class="p-3">
                        <div class="flex items-center gap-1">
                            <input type="number" min="1" max="100" value="${item.count}" onchange="updateItemCount('${item.id}', this.value)"
                                class="w-16 px-2 py-1 bg-transparent border border-slate-200 rounded text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <span class="text-xs text-slate-400">/ ${item.maxCount || item.count}</span>
                        </div>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="deleteItem('${item.id}')" class="p-1.5 text-rose-500 hover:bg-rose-50 rounded-lg transition" title="削除">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        // Item CRUD Operations
        function handleAddItem(e) {
            e.preventDefault();
            const nameInput = document.getElementById('new-item-name');
            const countInput = document.getElementById('new-item-count');

            const name = nameInput.value.trim();
            const count = parseInt(countInput.value) || 10;

            if (!name) return;

            const newItem = {
                id: Date.now().toString(),
                name: name,
                count: count,
                maxCount: count
            };

            appState.items.push(newItem);
            saveData();
            renderAdminItems();

            nameInput.value = '';
            countInput.value = '10';
        }

        function updateItemName(id, newName) {
            const item = appState.items.find(i => i.id === id);
            if (item) {
                item.name = newName.trim();
                saveData();
            }
        }

        function updateItemCount(id, newCountStr) {
            const count = parseInt(newCountStr);
            const item = appState.items.find(i => i.id === id);
            if (item && !isNaN(count)) {
                item.count = Math.max(0, Math.min(100, count));
                item.maxCount = Math.max(item.count, item.maxCount || item.count);
                saveData();
                renderAdminItems();
            }
        }

        function deleteItem(id) {
            appState.items = appState.items.filter(i => i.id !== id);
            saveData();
            renderAdminItems();
        }

        // Settings Form Load & Save
        function loadSettingsToForm() {
            const s = appState.settings;
            document.getElementById('setting-title').value = s.title || DEFAULT_SETTINGS.title;
            document.getElementById('setting-bg-color').value = s.bgColor || '#f8fafc';
            document.getElementById('setting-text-color').value = s.textColor || '#1e293b';
            document.getElementById('setting-btn-color').value = s.btnColor || '#4f46e5';
            document.getElementById('setting-bg-image').value = s.bgImage || '';
            document.getElementById('setting-win-message').value = s.winMessage || DEFAULT_SETTINGS.winMessage;
            document.getElementById('setting-custom-css').value = s.customCss || '';
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            appState.settings = {
                title: document.getElementById('setting-title').value,
                bgColor: document.getElementById('setting-bg-color').value,
                textColor: document.getElementById('setting-text-color').value,
                btnColor: document.getElementById('setting-btn-color').value,
                bgImage: document.getElementById('setting-bg-image').value,
                winMessage: document.getElementById('setting-win-message').value,
                customCss: document.getElementById('setting-custom-css').value
            };

            saveData();
            applySettings();
            showCustomMessage('設定を保存しました。');
        }

        // HTML Escape Helper
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Window Onload Initialization
        window.onload = function () {
            initApp();
        };
    </script>
</body>
</html>
