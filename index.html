<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    <title id="page-title">Halloweenクジ</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --bg-image: none;
            --text-color: #333333;
            --btn-color: #4CAF50;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
        }

        .admin-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .admin-btn:hover { background-color: #333; }

        .main-panel, .admin-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hidden { display: none !important; }

        .draw-section {
            text-align: center;
            margin: 30px 0;
        }

        #draw-btn {
            background-color: var(--btn-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        #draw-btn:active { transform: scale(0.98); }
        #draw-btn:disabled { background-color: #cccccc; cursor: not-allowed; }

        #result-display {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 20px;
            min-height: 40px;
            text-align: center;
        }

        .history-section {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            font-size: 0.9rem;
        }

        th { background-color: #f2f2f2; }

        .admin-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .admin-section h3 { margin-top: 0; }

        input, select, textarea {
            padding: 8px;
            margin: 5px 0 10px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button.action-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        button.action-btn:hover { background-color: #0b7dda; }

        button.danger-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        button.danger-btn:hover { background-color: #da190b; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1 id="app-title">ワクワククジ引き</h1>
                <p id="app-description" style="margin: 5px 0 0 0; font-size: 0.9rem; color: #666;">毎日の運試し！何が当たるかな？</p>
            </div>
            <div>
                <button id="toggle-admin-btn" class="admin-btn" onclick="toggleAdmin()">管理画面</button>
            </div>
        </header>

        <!-- ユーザー画面 -->
        <div id="user-view" class="main-panel">
            <div class="draw-section">
                <p id="remaining-count" style="font-weight: bold; margin-bottom: 15px;"></p>
                <button id="draw-btn" onclick="drawLottery()">クジを引く！</button>
                <div id="result-display"></div>
            </div>

            <div class="history-section">
                <h3>当選履歴</h3>
                <div style="max-height: 200px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>日時</th>
                                <th>当たったアイテム</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            <!-- 履歴がここに挿入されます -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 管理画面 -->
        <div id="admin-view" class="admin-panel hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>管理画面</h2>
                <button class="action-btn" onclick="location.reload()" style="background-color: #ff9800;">更新を維持してリロード</button>
            </div>

            <!-- パスワード認証 -->
            <div id="auth-section" class="admin-section">
                <h3>管理人認証</h3>
                <p style="font-size: 0.85rem; color: #555;">※ソースコードを見ても見えない仕組みで保護されています。管理人にはヒントとして「days」が表示されます。</p>
                <input type="password" id="admin-pass-input" placeholder="パスワードを入力">
                <button class="action-btn" onclick="authAdmin()">ログイン</button>
            </div>

            <!-- 認証後メニュー -->
            <div id="admin-controls" class="hidden">
                <!-- 回数制限・リセット -->
                <div class="admin-section">
                    <h3>制限・回数管理</h3>
                    <label>1日に引ける回数（現在: <span id="current-limit-display">3</span>回）</label>
                    <input type="number" id="daily-limit-input" min="1" max="10" value="3">
                    <button class="action-btn" onclick="updateDailyLimit()">回数を変更</button>
                    <button class="danger-btn" onclick="resetUserCounts()" style="margin-top: 10px; width: 100%;">本日のユーザーの回数制限をリセット</button>
                </div>

                <!-- セリフ設定 -->
                <div class="admin-section">
                    <h3>当選時のセリフ一括変更</h3>
                    <input type="text" id="win-message-input" value="おめでとうございます！クジで見事「{item}」を当てました！">
                    <button class="action-btn" onclick="updateWinMessage()">セリフを保存</button>
                </div>

                <!-- デザイン設定 -->
                <div class="admin-section">
                    <h3>デザイン・表示設定</h3>
                    <label>タイトル</label>
                    <input type="text" id="setting-title" value="ワクワククジ引き">
                    <label>簡単な説明</label>
                    <input type="text" id="setting-desc" value="毎日の運試し！何が当たるかな？">
                    <label>背景色</label>
                    <input type="color" id="setting-bgcolor" value="#f4f7f6">
                    <label>背景画像URL（未指定の場合はなし）</label>
                    <input type="text" id="setting-bgimage" placeholder="https://example.com/image.jpg">
                    <label>文字色</label>
                    <input type="color" id="setting-textcolor" value="#333333">
                    <label>クジ引きボタン色</label>
                    <input type="color" id="setting-btncolor" value="#4CAF50">
                    <label>カスタムCSS</label>
                    <textarea id="setting-custom-css" placeholder=".container { border-radius: 0; }"></textarea>
                    <button class="action-btn" onclick="updateDesignSettings()">デザインを保存</button>
                </div>

                <!-- アイテム管理 -->
                <div class="admin-section">
                    <h3>アイテム管理</h3>
                    <div style="margin-bottom: 15px; background: #fff; padding: 10px; border: 1px solid #ddd;">
                        <h4>新規アイテム追加</h4>
                        <label>アイテム名称</label>
                        <input type="text" id="new-item-name" placeholder="例: 特賞 高級肉">
                        <label>個数 (1〜100)</label>
                        <input type="number" id="new-item-count" min="1" max="100" value="10">
                        <button class="action-btn" onclick="addItem()">アイテムを追加して保存</button>
                    </div>

                    <h4>現在のアイテム一覧</h4>
                    <table>
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>残り個数</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="admin-items-table">
                            <!-- アイテム一覧がここに挿入されます -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'lottery_app_data_v2';

        const DEFAULT_DATA = {
            dailyLimit: 3,
            winMessage: "おめでとうございます！クジで見事「{item}」を当てました！",
            title: "ワクワククジ引き",
            description: "毎日の運試し！何が当たるかな？",
            bgColor: "#f4f7f6",
            bgImage: "",
            textColor: "#333333",
            btnColor: "#4CAF50",
            customCss: "",
            items: [
                { id: 1, name: "特賞: 豪華焼肉セット", count: 1 },
                { id: 2, name: "C賞：ハロウィン お菓子セット", count: 7 },
                { id: 3, name: "Y賞：ハロウィンバカデカいチキン", count: 7 },
                { id: 4, name: "参加賞: ミンゴママ オリジナルステッカー", count: 12 }
            　　　 { id: 5, name: "ハロウィンキャンディー(ぐるぐる猫)", count: 3 }
            ],
            history: [],
            userUsage: {},
            lastResetDate: ""
        };

        let appData = loadData();

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : DEFAULT_DATA;
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        function checkDailyReset() {
            const today = new Date().toLocaleDateString();
            if (appData.lastResetDate !== today) {
                appData.lastResetDate = today;
                saveData();
            }
        }

        function initApp() {
            checkDailyReset();
            applyDesign();
            updateUserView();
        }

        function applyDesign() {
            document.getElementById('app-title').innerText = appData.title;
            document.getElementById('page-title').innerText = appData.title;
            document.getElementById('app-description').innerText = appData.description;
            
            const root = document.documentElement;
            root.style.setProperty('--bg-color', appData.bgColor);
            root.style.setProperty('--bg-image', appData.bgImage ? `url(${appData.bgImage})` : 'none');
            root.style.setProperty('--text-color', appData.textColor);
            root.style.setProperty('--btn-color', appData.btnColor);

            let styleTag = document.getElementById('dynamic-custom-css');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'dynamic-custom-css';
                document.head.appendChild(styleTag);
            }
            styleTag.innerHTML = appData.customCss || '';
        }

        function getUserTodayKey() {
            return new Date().toLocaleDateString();
        }

        function updateUserView() {
            const today = getUserTodayKey();
            if (!appData.userUsage[today]) {
                appData.userUsage[today] = { count: 0 };
            }
            const usedCount = appData.userUsage[today].count;
            const limit = appData.dailyLimit;
            const remaining = Math.max(0, limit - usedCount);

            document.getElementById('remaining-count').innerText = `本日のクジ引き残り回数: ${remaining} / ${limit} 回`;
            
            const drawBtn = document.getElementById('draw-btn');
            if (remaining <= 0) {
                drawBtn.disabled = true;
                drawBtn.innerText = "本日の回数は終了しました";
            } else {
                drawBtn.disabled = false;
                drawBtn.innerText = "クジを引く！";
            }

            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '';
            appData.history.slice().reverse().forEach(h => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${h.time}</td><td>${h.item}</td>`;
                tbody.appendChild(tr);
            });
        }

        function drawLottery() {
            const today = getUserTodayKey();
            if (!appData.userUsage[today]) {
                appData.userUsage[today] = { count: 0 };
            }
            if (appData.userUsage[today].count >= appData.dailyLimit) {
                alert("本日のクジ引き回数上限に達しています。");
                return;
            }

            let pool = [];
            appData.items.forEach(item => {
                for (let i = 0; i < item.count; i++) {
                    pool.push(item);
                }
            });

            if (pool.length === 0) {
                document.getElementById('result-display').innerText = "現在引けるアイテムがありません。";
                return;
            }

            const index = Math.floor(Math.random() * pool.length);
            const wonItem = pool[index];

            const targetItem = appData.items.find(i => i.id === wonItem.id);
            if (targetItem && targetItem.count > 0) {
                targetItem.count--;
            }

            appData.userUsage[today].count++;
            const nowTime = new Date().toLocaleString();
            appData.history.push({ time: nowTime, item: wonItem.name });

            saveData();
            updateUserView();

            const message = appData.winMessage.replace('{item}', wonItem.name);
            document.getElementById('result-display').innerText = message;
        }

        function toggleAdmin() {
            const userView = document.getElementById('user-view');
            const adminView = document.getElementById('admin-view');
            userView.classList.toggle('hidden');
            adminView.classList.toggle('hidden');
        }

        function authAdmin() {
            const passInput = document.getElementById('admin-pass-input').value;
            if (passInput === 'days') {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
                loadAdminControls();
            } else {
                alert('パスワードが間違っています。');
            }
        }

        function loadAdminControls() {
            document.getElementById('current-limit-display').innerText = appData.dailyLimit;
            document.getElementById('daily-limit-input').value = appData.dailyLimit;
            document.getElementById('win-message-input').value = appData.winMessage;
            
            document.getElementById('setting-title').value = appData.title;
            document.getElementById('setting-desc').value = appData.description;
            document.getElementById('setting-bgcolor').value = appData.bgColor;
            document.getElementById('setting-bgimage').value = appData.bgImage;
            document.getElementById('setting-textcolor').value = appData.textColor;
            document.getElementById('setting-btncolor').value = appData.btnColor;
            document.getElementById('setting-custom-css').value = appData.customCss;

            renderAdminItems();
        }

        function updateDailyLimit() {
            const newLimit = parseInt(document.getElementById('daily-limit-input').value);
            if (isNaN(newLimit) || newLimit < 1) {
                alert("有効な数値を入力してください。");
                return;
            }
            appData.dailyLimit = newLimit;
            saveData();
            document.getElementById('current-limit-display').innerText = newLimit;
            alert("回数制限を保存・変更しました。");
            updateUserView();
        }

        function resetUserCounts() {
            if (confirm("本日のユーザー利用回数をリセットしますか？")) {
                const today = getUserTodayKey();
                if (appData.userUsage[today]) {
                    appData.userUsage[today].count = 0;
                }
                saveData();
                updateUserView();
                alert("回数制限をリセットしました。");
            }
        }

        function updateWinMessage() {
            const msg = document.getElementById('win-message-input').value;
            appData.winMessage = msg;
            saveData();
            alert("当選時のセリフを保存しました。");
        }

        function updateDesignSettings() {
            appData.title = document.getElementById('setting-title').value;
            appData.description = document.getElementById('setting-desc').value;
            appData.bgColor = document.getElementById('setting-bgcolor').value;
            appData.bgImage = document.getElementById('setting-bgimage').value;
            appData.textColor = document.getElementById('setting-textcolor').value;
            appData.btnColor = document.getElementById('setting-btncolor').value;
            appData.customCss = document.getElementById('setting-custom-css').value;
            
            saveData();
            applyDesign();
            alert("デザイン設定を保存しました。");
        }

        function renderAdminItems() {
            const tbody = document.getElementById('admin-items-table');
            tbody.innerHTML = '';
            appData.items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" value="${item.name}" onchange="updateItemName(${item.id}, this.value)"></td>
                    <td><input type="number" min="1" max="100" value="${item.count}" onchange="updateItemCount(${item.id}, this.value)" style="width: 80px;"></td>
                    <td><button class="danger-btn" onclick="deleteItem(${item.id})">削除</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addItem() {
            const name = document.getElementById('new-item-name').value.trim();
            const count = parseInt(document.getElementById('new-item-count').value);

            if (!name) {
                alert("アイテム名を入力してください。");
                return;
            }
            if (isNaN(count) || count < 1 || count > 100) {
                alert("個数は1から100の間で指定してください。");
                return;
            }

            const newId = appData.items.length > 0 ? Math.max(...appData.items.map(i => i.id)) + 1 : 1;
            appData.items.push({ id: newId, name: name, count: count });
            
            // 確実にストレージへ保存
            saveData();
            renderAdminItems();
            
            document.getElementById('new-item-name').value = '';
            document.getElementById('new-item-count').value = '10';
            alert("新しいアイテムを追加して保存しました！");
        }

        function updateItemName(id, newName) {
            const item = appData.items.items ? null : appData.items.find(i => i.id === id);
            if (item) {
                item.name = newName;
                saveData();
            }
        }

        function updateItemCount(id, newCount) {
            const count = parseInt(newCount);
            if (isNaN(count) || count < 1 || count > 100) {
                alert("個数は1から100の間で指定してください。");
                renderAdminItems();
                return;
            }
            const item = appData.items.find(i => i.id === id);
            if (item) {
                item.count = count;
                saveData();
            }
        }

        function deleteItem(id) {
            if (confirm("このアイテムを削除しますか？")) {
                appData.items = appData.items.filter(i => i.id !== id);
                saveData();
                renderAdminItems();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
